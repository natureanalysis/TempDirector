[workspace]
resolver = "2"
members = ["crates/td-core", "crates/td-cli", "crates/td-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["natureanalysis"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
filetime = "0.2"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
junction = "1.1"
windows-sys = "0.60"

# 依赖用 O1、自身代码用 O3：链接/搬运是 IO 密集，依赖侧优化级别对运行性能无影响，
# 但能显著压低全量重建时间（与 Provenan 桌面端的构建惯例保持一致）。
[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
incremental = true

[profile.release.package."*"]
opt-level = 1
